<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <title>Solartelligence is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #020617;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 10%, rgba(34, 211, 238, 0.11), transparent 42%),
          #020617;
      }

      main {
        width: min(100%, 420px);
        padding: 32px 26px;
        text-align: center;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .status {
        display: inline-flex;
        margin-bottom: 18px;
        padding: 7px 11px;
        border: 1px solid rgba(34, 211, 238, 0.28);
        border-radius: 999px;
        color: #67e8f9;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.03em;
      }

      p {
        margin: 12px 0 24px;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 14px;
        background: #22d3ee;
        color: #041014;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status">Connection needed</span>
      <h1>Solartelligence is offline</h1>
      <p>
        Connect to the internet, then retry to load roof imagery, reports, and
        your saved solar analysis.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
